# Test group matrix for the sublibrary CI discovery (SciML reusable
# sublibrary-project-tests workflow). Each table header is a test group;
# runtests.jl dispatches on BOUNDARYVALUEDIFFEQ_TEST_GROUP matching the name.
#
# BASIC, NLLS and MISC partition the solver tests in test/Core/. On LTS the
# basic and NLLS tests alone took 110 minutes, exhausting Core's 120-minute
# budget before the remaining tests could finish. Keep Core as a local/downgrade
# aggregate in runtests.jl, but run these partitions separately in CI.
# QA (Aqua) adds extra deps via test/qa/Project.toml.
# GPU runs in its own CUDA environment on the SciML GPU runner.

[BASIC]
versions = ["lts", "1", "pre"]

[NLLS]
versions = ["lts", "1", "pre"]

[MISC]
versions = ["lts", "1", "pre"]

# DAE: the index-1 DAE (singular mass matrix) tests.
[DAE]
versions = ["lts", "1", "pre"]

# Portable GPU kernels, sparse differentiation and interpolation on the CPU.
# Includes JLArrays storage and scalar-indexing checks without requiring CUDA.
# Run separately from the solver tests.
[DeviceKernels]
versions = ["lts", "1", "pre"]

[GPU]
versions = ["1"]
runner = ["self-hosted", "Linux", "X64", "gpu"]
timeout = 120

# AD: different-AD-backend (Enzyme/Mooncake) compatibility tests. The heavy
# optional backends live in test/AD/Project.toml (kept out of the main test env so
# the Downgrade lane does not force a joint at-floor resolve of them).
[AD]
versions = ["lts", "1", "pre"]

[QA]
versions = ["lts", "1"]
