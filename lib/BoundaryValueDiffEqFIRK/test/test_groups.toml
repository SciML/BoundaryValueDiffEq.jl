# BoundaryValueDiffEqFIRK splits its solver tests into two expensive groups
# (expanded vs nested FIRK formulations) rather than the default single "Core"
# group, so the real group names must be declared here for the sublibrary CI
# matrix discovery. runtests.jl dispatches on BOUNDARYVALUEDIFFEQ_TEST_GROUP
# matching these names. QA (Aqua) runs on release + LTS Julia only.
#
# The downgrade workflow passes a uniform "Core" group to every sublibrary;
# runtests.jl maps "Core" to the basic FIRK solve tests of both formulations.
# "Core" is intentionally NOT listed below: those basic tests already run inside
# the EXPANDED and NESTED matrix groups, so adding a "Core" matrix entry would
# only duplicate them across the full version matrix.

[PUBLIC_FACADE]
versions = ["lts", "1", "pre"]
timeout = 30

# The expanded formulation is split across five groups. Almost all of its runtime is
# Julia compilation -- each (problem, solver) pair specializes the whole FIRK ->
# NonlinearSolve -> AD stack from scratch at roughly 20 s -- and the Affineness and
# Convergence sweeps each run 16 solvers over 4 problems. As a single group it ran past
# two hours (issue #548). runtests.jl still defines an aggregate "EXPANDED" group for
# local use; it is deliberately not a matrix entry here.

[EXPANDED_BASIC]
versions = ["lts", "1", "pre"]
# The self-hosted ubuntu-latest pool repeatedly loses the LTS runner mid-test.
# Use the GitHub-hosted image where this group has completed successfully.
runner = ["ubuntu-24.04"]
timeout = 120

[EXPANDED_AFFINENESS]
versions = ["lts", "1", "pre"]
timeout = 120

[EXPANDED_CONVERGENCE]
versions = ["lts", "1", "pre"]
timeout = 120

[EXPANDED_NLLS]
versions = ["lts", "1", "pre"]
timeout = 120

[EXPANDED_MISC]
versions = ["lts", "1", "pre"]
timeout = 120

# The nested formulation is split the same way, plus a group for the pendulum sweep.
# Nested solvers run an inner nonlinear solve per mesh point, so unlike the expanded
# groups a large part of their runtime is genuine solve time rather than compilation:
# nested "Simple Pendulum" alone runs ~55 min. As with EXPANDED, runtests.jl keeps an
# aggregate "NESTED" group for local use that is not a matrix entry here.

[NESTED_BASIC]
versions = ["lts", "1", "pre"]
timeout = 120

[NESTED_AFFINENESS]
versions = ["lts", "1", "pre"]
timeout = 120

[NESTED_CONVERGENCE]
versions = ["lts", "1", "pre"]
timeout = 120

[NESTED_PENDULUM]
versions = ["lts", "1", "pre"]
timeout = 180

[NESTED_NLLS]
versions = ["lts", "1", "pre"]
timeout = 120

# The full underconstrained sweep exceeded the six-hour job limit on LTS.
# Partition by nonlinear solver, preserving all 22 cases across the three jobs.
[NESTED_NLLS_UNDERCONSTRAINED_NEWTON]
versions = ["lts", "1", "pre"]
timeout = 360

[NESTED_NLLS_UNDERCONSTRAINED_GAUSS_NEWTON]
versions = ["lts", "1", "pre"]
timeout = 360

[NESTED_NLLS_UNDERCONSTRAINED_TRUST_REGION]
versions = ["lts", "1", "pre"]
timeout = 360

[NESTED_MISC]
versions = ["lts", "1", "pre"]
timeout = 120

# AD: different-AD-backend (Enzyme/Mooncake) compatibility tests. The heavy
# optional backends live in test/AD/Project.toml (kept out of the main test env so
# the Downgrade lane does not force a joint at-floor resolve of them). Matches the
# EXPANDED/NESTED version matrix.
[AD]
versions = ["lts", "1", "pre"]
timeout = 240

[QA]
versions = ["lts", "1"]

[DeviceKernels]
versions = ["lts", "1", "pre"]
timeout = 120

# CUDA tests run in their own environment on the SciML GPU runner.
[GPU]
versions = ["1"]
runner = ["self-hosted", "Linux", "X64", "gpu"]
timeout = 120
